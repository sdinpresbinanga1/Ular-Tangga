<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ular Tangga 3D Pembelajaran</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1e293b; color: #f8fafc; }
    
    /* Layar Halaman */
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: absolute; top: 0; left: 0; }
    .screen.active { display: flex; }

    /* Card UI */
    .card { background: #334155; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 500px; text-align: center; }
    h1, h2 { margin-bottom: 20px; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 16px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #64748b; cursor: not-allowed; }

    /* Grid Kelas */
    .kelas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
    .kelas-btn { padding: 20px; font-size: 18px; background: #0d9488; }
    .kelas-btn:hover { background: #0f766e; }

    /* Catatan */
    .catatan-box { background: #1e293b; padding: 20px; border-radius: 10px; text-align: left; max-height: 300px; overflow-y: auto; margin-bottom: 20px; line-height: 1.6; border-left: 5px solid #38bdf8; }

    /* Acak Siswa */
    .player-select-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .player-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 8px; border-left: 6px solid #fff; }
    .btn-skip { background: #e11d48; padding: 6px 12px; font-size: 14px; }
    .btn-skip:hover { background: #be123c; }

    /* Layar Game Split */
    #screen-game { padding: 0; justify-content: flex-start; }
    #canvas-container { width: 100%; height: 52%; position: relative; background: #0f172a; }
    #hud-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-badge { background: rgba(15, 23, 42, 0.8); padding: 6px 14px; border-radius: 20px; font-weight: bold; border: 1px solid #38bdf8; }

    /* 4 Panel Siswa Bawah */
    #players-panel { width: 100%; height: 48%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; background: #0f172a; touch-action: none; }
    .p-card { background: #1e293b; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; border-top: 5px solid #fff; position: relative; overflow: hidden; }
    .p-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .p-soal { font-size: 13px; font-weight: 600; my: 6px; flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; overflow-y: auto; padding: 4px; }
    .p-options { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .opt-btn { background: #334155; color: white; border: 1px solid #475569; padding: 8px 4px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; touch-action: manipulation; }
    .opt-btn:active { transform: scale(0.95); background: #0284c7; }
    .p-status-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); display: none; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; text-align: center; padding: 10px; z-index: 5; }

    /* Hasil Akhir */
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 10px; border-bottom: 1px solid #475569; text-align: center; }
    th { background: #1e293b; color: #38bdf8; }
  </style>
</head>
<body>

  <!-- Audio Backsound -->
  <audio id="bg-music" src="sound.mp3" loop preload="auto"></audio>

  <!-- 1. HALAMAN LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="card">
      <h1>Login Admin</h1>
      <input type="text" id="login-user" placeholder="Username">
      <input type="password" id="login-pass" placeholder="Password">
      <button id="btn-login" onclick="handleLogin()">Masuk</button>
      <p id="login-msg" style="color: #f43f5e; margin-top: 10px; font-size: 14px;"></p>
    </div>
  </div>

  <!-- 2. HALAMAN PILIH KELAS -->
  <div id="screen-kelas" class="screen">
    <div class="card">
      <h2>Pilih Kelas</h2>
      <div id="kelas-list" class="kelas-grid"></div>
    </div>
  </div>

  <!-- 3. HALAMAN CATATAN -->
  <div id="screen-catatan" class="screen">
    <div class="card" style="max-width: 650px;">
      <h2>Catatan Pembelajaran</h2>
      <div id="catatan-content" class="catatan-box"></div>
      <button onclick="goToAcak()">Lanjut Acak Pemain</button>
    </div>
  </div>

  <!-- 4. HALAMAN ACAK 4 SISWA -->
  <div id="screen-acak" class="screen">
    <div class="card">
      <h2>Pemain Terpilih (<span id="label-kelas"></span>)</h2>
      <div id="selected-players" class="player-select-list"></div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button style="background: #64748b;" onclick="acakUlangSemua()">Acak Ulang Semua</button>
        <button style="background: #16a34a;" onclick="startGame()">MULAI GAME</button>
      </div>
    </div>
  </div>

  <!-- 5. HALAMAN GAME 3D & 4 PANEL SOAL -->
  <div id="screen-game" class="screen">
    <div id="canvas-container">
      <div id="hud-top">
        <div class="hud-badge" id="hud-kelas">Kelas: -</div>
        <div class="hud-badge" id="hud-timer">Waktu: 00:00</div>
      </div>
    </div>
    <div id="players-panel"></div>
  </div>

  <!-- 6. HALAMAN HASIL / LEADERBOARD -->
  <div id="screen-hasil" class="screen">
    <div class="card" style="max-width: 600px;">
      <h1>Hasil Permainan</h1>
      <table>
        <thead>
          <tr>
            <th>Peringkat</th>
            <th>Nama Siswa</th>
            <th>Nilai</th>
            <th>Timer</th>
          </tr>
        </thead>
        <tbody id="hasil-tbody"></tbody>
      </table>
      <p id="save-status" style="font-size: 13px; color: #38bdf8; margin-bottom: 15px;">Menyimpan ke database...</p>
      <button onclick="location.reload()">Main Lagi</button>
    </div>
  </div>

  <script>
    // ==========================================
    // KONFIGURASI URL GOOGLE APPS SCRIPT ANDA
    // ==========================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxn2cHrynm_OZDfUttcEx6OFrzn-BWmzNLEVyfVAP2eEjGINc93Fy28MG6GrPm7qTPqJA/exec';

    // State Global
    let dbData = { kelas: {}, catatan: [], soal: [] };
    let currentKelas = '';
    let availableStudents = [];
    let activePlayers = []; // 4 siswa terpilih
    let gameStartTime = 0;
    let timerInterval = null;
    let finishedCount = 0;

    // Warna Karakter (Merah, Biru, Hijau, Kuning)
    const PLAYER_COLORS = [
      { hex: '#ef4444', three: 0xef4444, name: 'Merah' },
      { hex: '#3b82f6', three: 0x3b82f6, name: 'Biru' },
      { hex: '#22c55e', three: 0x22c55e, name: 'Hijau' },
      { hex: '#eab308', three: 0xeab308, name: 'Kuning' }
    ];

    // Definisi Tangga (Naik) & Ular (Turun) - Petak 1 sampai 100
    const LADDERS = { 4: 25, 13: 46, 33: 49, 42: 63, 50: 69, 62: 81, 74: 92 };
    const SNAKES  = { 27: 5, 40: 3, 43: 18, 54: 31, 66: 45, 76: 58, 89: 53, 99: 41 };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // 1. LOGIN ADMIN
    async function handleLogin() {
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      const msg = document.getElementById('login-msg');
      const btn = document.getElementById('btn-login');

      if (!user || !pass) { msg.innerText = 'Isi username dan password!'; return; }
      btn.disabled = true;
      msg.innerText = 'Memeriksa akun & memuat database...';

      try {
        const resLogin = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const loginJson = await resLogin.json();

        if (loginJson.status === 'success') {
          const resData = await fetch(`${GAS_URL}?action=getData`);
          dbData = await resData.json();
          renderKelasButtons();
          showScreen('screen-kelas');
        } else {
          msg.innerText = loginJson.message;
          btn.disabled = false;
        }
      } catch (err) {
        msg.innerText = 'Gagal terhubung ke server. Periksa URL GAS.';
        btn.disabled = false;
      }
    }

    // 2. PILIH KELAS
    function renderKelasButtons() {
      const container = document.getElementById('kelas-list');
      container.innerHTML = '';
      Object.keys(dbData.kelas).forEach(kls => {
        const btn = document.createElement('button');
        btn.className = 'kelas-btn';
        btn.innerText = kls.replace('_', ' ');
        btn.onclick = () => selectKelas(kls);
        container.appendChild(btn);
      });
    }

    function selectKelas(kls) {
      currentKelas = kls;
      availableStudents = [...dbData.kelas[kls]];
      
      // Tampilkan Catatan
      const catBox = document.getElementById('catatan-content');
      catBox.innerHTML = dbData.catatan.map(c => `<p style="margin-bottom:10px;">• ${c}</p>`).join('');
      showScreen('screen-catatan');
    }

    // 3. ACAK 4 NAMA + TOMBOL SKIP
    function goToAcak() {
      document.getElementById('label-kelas').innerText = currentKelas.replace('_', ' ');
      acakUlangSemua();
      showScreen('screen-acak');
    }

    function acakUlangSemua() {
      let pool = [...dbData.kelas[currentKelas]];
      pool.sort(() => Math.random() - 0.5);
      activePlayers = pool.slice(0, 4).map((name, idx) => ({
        id: idx,
        name: name,
        color: PLAYER_COLORS[idx],
        pos: 1, // Mulai dari petak 1
        score: 0,
        finished: false,
        finishTime: '',
        isMoving: false,
        currentSoalIdx: Math.floor(Math.random() * dbData.soal.length),
        mesh: null
      }));
      availableStudents = pool.slice(4);
      renderSelectedPlayers();
    }

    function skipPlayer(index) {
      if (availableStudents.length === 0) {
        alert('Cadangan siswa di kelas ini sudah habis!');
        return;
      }
      const nextStudent = availableStudents.shift();
      activePlayers[index].name = nextStudent;
      renderSelectedPlayers();
    }

    function renderSelectedPlayers() {
      const list = document.getElementById('selected-players');
      list.innerHTML = '';
      activePlayers.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.style.borderLeftColor = p.color.hex;
        div.innerHTML = `
          <span><strong>P${idx + 1}:</strong> ${p.name}</span>
          <button class="btn-skip" onclick="skipPlayer(${idx})">Skip (Tidak Hadir)</button>
        `;
        list.appendChild(div);
      });
    }

    // ==========================================
    // 4. ENGINE 3D THREE.JS (PAPAN, ULAR, TANGGA)
    // ==========================================
    let scene, camera, renderer;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 12.5, 11.5);
      camera.lookAt(0, 0, 0.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Pencahayaan
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(8, 15, 10);
      scene.add(dirLight);

      // Buat Papan 10x10 (Petak 1 - 100)
      const tileGeo = new THREE.BoxGeometry(0.96, 0.2, 0.96);
      for (let num = 1; num <= 100; num++) {
        const coords = getTileCoordinates(num);
        const isEven = num % 2 === 0;
        const mat = new THREE.MeshLambertMaterial({ color: isEven ? 0xe2e8f0 : 0x38bdf8 });
        const tile = new THREE.Mesh(tileGeo, mat);
        tile.position.set(coords.x, 0, coords.z);
        scene.add(tile);
      }

      // Gambar Tangga 3D (Hijau/Emas)
      Object.entries(LADDERS).forEach(([start, end]) => {
        drawConnector3D(parseInt(start), parseInt(end), 0x10b981, 0.12);
      });

      // Gambar Ular 3D (Merah/Ungu)
      Object.entries(SNAKES).forEach(([start, end]) => {
        drawConnector3D(parseInt(start), parseInt(end), 0xf43f5e, 0.18);
      });

      // Buat Bidak 4 Pemain
      const pawnGeo = new THREE.ConeGeometry(0.28, 0.8, 16);
      activePlayers.forEach((p, idx) => {
        const pawnMat = new THREE.MeshLambertMaterial({ color: p.color.three });
        const mesh = new THREE.Mesh(pawnGeo, pawnMat);
        const startPos = getTileCoordinates(1);
        const offset = getPlayerOffset(idx);
        mesh.position.set(startPos.x + offset.x, 0.5, startPos.z + offset.z);
        scene.add(mesh);
        p.mesh = mesh;
      });

      window.addEventListener('resize', () => {
        if (!container.clientWidth) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      animate3D();
    }

    function getTileCoordinates(num) {
      const idx = num - 1;
      const row = Math.floor(idx / 10);
      let col = idx % 10;
      if (row % 2 === 1) col = 9 - col; // Zig-zag ular tangga
      return {
        x: col - 4.5,
        z: 4.5 - row
      };
    }

    function getPlayerOffset(playerIdx) {
      const offsets = [
        { x: -0.22, z: -0.22 },
        { x:  0.22, z: -0.22 },
        { x: -0.22, z:  0.22 },
        { x:  0.22, z:  0.22 }
      ];
      return offsets[playerIdx];
    }

    function drawConnector3D(startTile, endTile, colorHex, radius) {
      const p1 = getTileCoordinates(startTile);
      const p2 = getTileCoordinates(endTile);
      const v1 = new THREE.Vector3(p1.x, 0.15, p1.z);
      const v2 = new THREE.Vector3(p2.x, 0.15, p2.z);

      const distance = v1.distanceTo(v2);
      const geo = new THREE.CylinderGeometry(radius, radius, distance, 8);
      const mat = new THREE.MeshLambertMaterial({ color: colorHex });
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.copy(v1).lerp(v2, 0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
      scene.add(mesh);
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      renderer.render(scene, camera);
    }

    // ==========================================
    // 5. LOGIKA GAME & MULTI-TOUCH 4 PANEL
    // ==========================================
    function startGame() {
      // Putar Audio
      const audio = document.getElementById('bg-music');
      audio.play().catch(e => console.log('Autoplay dicegah browser:', e));

      document.getElementById('hud-kelas').innerText = `Kelas: ${currentKelas.replace('_', ' ')}`;
      showScreen('screen-game');
      init3D();
      renderPlayerPanels();

      // Mulai Timer
      gameStartTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      document.getElementById('hud-timer').innerText = `Waktu: ${mins}:${secs}`;
    }

    function getFormattedTime() {
      const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function renderPlayerPanels() {
      const panel = document.getElementById('players-panel');
      panel.innerHTML = '';

      activePlayers.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'p-card';
        card.id = `p-card-${idx}`;
        card.style.borderTopColor = p.color.hex;

        card.innerHTML = `
          <div class="p-header">
            <span style="color:${p.color.hex}">${p.name}</span>
            <span id="p-pos-${idx}">Petak: 1</span>
          </div>
          <div class="p-soal" id="p-soal-${idx}"></div>
          <div class="p-options" id="p-opts-${idx}"></div>
          <div class="p-status-overlay" id="p-overlay-${idx}"></div>
        `;
        panel.appendChild(card);
        loadQuestionForPlayer(idx);
      });
    }

    function loadQuestionForPlayer(pIdx) {
      const player = activePlayers[pIdx];
      if (player.finished) return;

      const soalObj = dbData.soal[player.currentSoalIdx];
      document.getElementById(`p-soal-${pIdx}`).innerText = soalObj.soal;

      const optsContainer = document.getElementById(`p-opts-${pIdx}`);
      optsContainer.innerHTML = '';

      ['A', 'B', 'C', 'D'].forEach(optKey => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${optKey}. ${soalObj[optKey]}`;
        
        // Gunakan pointerdown agar multi-touch 4 jari merespons instan tanpa bentrok
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleAnswer(pIdx, optKey);
        });
        optsContainer.appendChild(btn);
      });
    }

    async function handleAnswer(pIdx, selectedOpt) {
      const player = activePlayers[pIdx];
      // Cegah double tap saat bidak sedang melompat atau sudah finish
      if (player.isMoving || player.finished) return;

      player.isMoving = true;
      const soalObj = dbData.soal[player.currentSoalIdx];
      const isCorrect = (selectedOpt === soalObj.kunci);
      const steps = isCorrect ? 6 : 1;

      if (isCorrect) player.score += 10;

      // Tampilkan feedback singkat di panel pemain tersebut
      const overlay = document.getElementById(`p-overlay-${pIdx}`);
      overlay.style.display = 'flex';
      overlay.style.color = isCorrect ? '#4ade80' : '#f87171';
      overlay.innerText = isCorrect ? 'BENAR!\nMaju 6 Langkah' : 'SALAH!\nMaju 1 Langkah';

      // Animasi melompat langkah demi langkah
      await movePlayerWithJump(pIdx, steps);

      // Cek apakah menginjak Tangga atau Ular
      if (LADDERS[player.pos]) {
        overlay.style.color = '#38bdf8';
        overlay.innerText = 'NAIK TANGGA!';
        await jumpToSpecificTile(pIdx, LADDERS[player.pos]);
      } else if (SNAKES[player.pos]) {
        overlay.style.color = '#fb7185';
        overlay.innerText = 'TURUN ULAR!';
        await jumpToSpecificTile(pIdx, SNAKES[player.pos]);
      }

      document.getElementById(`p-pos-${pIdx}`).innerText = `Petak: ${player.pos}`;

      // Cek Finish (Petak 100)
      if (player.pos >= 100) {
        player.finished = true;
        player.finishTime = getFormattedTime();
        finishedCount++;
        overlay.style.color = '#facc15';
        overlay.innerText = `FINISH!\nJuara #${finishedCount}\nWaktu: ${player.finishTime}`;
        
        // Jika semua pemain selesai, akhiri game & simpan hasil
        if (finishedCount === activePlayers.length) {
          setTimeout(endGameAndSave, 1500);
        }
        return;
      }

      // Lanjut ke soal berikutnya secara acak
      overlay.style.display = 'none';
      player.currentSoalIdx = (player.currentSoalIdx + 1 + Math.floor(Math.random() * 3)) % dbData.soal.length;
      loadQuestionForPlayer(pIdx);
      player.isMoving = false;
    }

    // Animasi Lompat Per Petak
    function movePlayerWithJump(pIdx, steps) {
      return new Promise(async (resolve) => {
        const player = activePlayers[pIdx];
        for (let s = 0; s < steps; s++) {
          if (player.pos >= 100) break;
          const nextTile = player.pos + 1;
          await animateSingleJump(pIdx, player.pos, nextTile, 220);
          player.pos = nextTile;
        }
        resolve();
      });
    }

    // Animasi Lompat Langsung (Ular / Tangga)
    function jumpToSpecificTile(pIdx, targetTile) {
      return new Promise(async (resolve) => {
        const player = activePlayers[pIdx];
        await animateSingleJump(pIdx, player.pos, targetTile, 450);
        player.pos = targetTile;
        resolve();
      });
    }

    function animateSingleJump(pIdx, fromTile, toTile, duration) {
      return new Promise((resolve) => {
        const player = activePlayers[pIdx];
        const offset = getPlayerOffset(pIdx);
        const startCoords = getTileCoordinates(fromTile);
        const endCoords = getTileCoordinates(toTile);

        const startX = startCoords.x + offset.x;
        const startZ = startCoords.z + offset.z;
        const endX = endCoords.x + offset.x;
        const endZ = endCoords.z + offset.z;

        const startTime = performance.now();

        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / duration, 1);

          // Interpolasi posisi X dan Z
          player.mesh.position.x = startX + (endX - startX) * t;
          player.mesh.position.z = startZ + (endZ - startZ) * t;

          // Kurva parabola untuk efek melompat (Y)
          const jumpHeight = 1.2;
          player.mesh.position.y = 0.5 + Math.sin(t * Math.PI) * jumpHeight;

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            player.mesh.position.y = 0.5;
            resolve();
          }
        }
        requestAnimationFrame(step);
      });
    }

    // 6. SIMPAN HASIL KE SPREADSHEET
    async function endGameAndSave() {
      clearInterval(timerInterval);
      document.getElementById('bg-music').pause();
      showScreen('screen-hasil');

      // Urutkan berdasarkan waktu tercepat
      const sorted = [...activePlayers].sort((a, b) => a.finishTime.localeCompare(b.finishTime));
      
      const tbody = document.getElementById('hasil-tbody');
      tbody.innerHTML = sorted.map((p, idx) => `
        <tr>
          <td>#${idx + 1}</td>
          <td>${p.name}</td>
          <td>${p.score}</td>
          <td>${p.finishTime}</td>
        </tr>
      `).join('');

      const payload = sorted.map(p => ({
        nama: `${p.name} (${currentKelas})`,
        nilai: p.score,
        timer: p.finishTime
      }));

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveResult', results: payload })
        });
        document.getElementById('save-status').innerText = 'Data nilai & timer berhasil tersimpan ke Google Sheets!';
      } catch (e) {
        document.getElementById('save-status').innerText = 'Gagal menyimpan data ke Google Sheets.';
      }
    }
  </script>
</body>
</html>
