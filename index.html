<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ular Tangga SD Inpres Binanga 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; }

    /* Layar Halaman */
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: absolute; top: 0; left: 0; }
    .screen.active { display: flex; }

    /* Card UI */
    .card { background: #1e293b; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.45); width: 100%; max-width: 520px; text-align: center; border: 1px solid #334155; }
    h1, h2 { margin-bottom: 18px; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
    button { background: #0284c7; color: white; border: none; padding: 11px 22px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.15s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }

    /* Grid Kelas */
    .kelas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 12px; }
    .kelas-btn { padding: 18px; font-size: 17px; background: #0d9488; }
    .kelas-btn:hover { background: #0f766e; }

    /* Catatan */
    .catatan-box { background: #0f172a; padding: 18px; border-radius: 10px; text-align: left; max-height: 280px; overflow-y: auto; margin-bottom: 18px; line-height: 1.6; border-left: 5px solid #38bdf8; }

    /* Acak Siswa */
    .player-select-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .player-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 11px 15px; border-radius: 8px; border-left: 6px solid #fff; }
    .btn-skip { background: #e11d48; padding: 6px 12px; font-size: 13px; }
    .btn-skip:hover { background: #be123c; }

    /* Layar Game Split */
    #screen-game { padding: 0; justify-content: flex-start; }

    /* Area Papan Gambar Penuh di Atas */
    #board-section {
      width: 100%;
      height: 52%;
      position: relative;
      background: #0ea5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #board-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    #board-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Bidak Pemain di Atas Gambar */
    .pawn {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.55);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      z-index: 6;
      pointer-events: none;
    }

    #hud-top {
      position: absolute;
      top: 8px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 12;
    }
    .hud-badge {
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      border: 1px solid #38bdf8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    /* 4 Panel Siswa Bawah */
    #players-panel {
      width: 100%;
      height: 48%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      background: #0f172a;
      touch-action: none;
    }

    .p-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 5px solid #fff;
      position: relative;
      overflow: hidden;
    }

    .p-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid #334155;
      padding-bottom: 3px;
    }

    /* Dadu di Atas Soal */
    .dice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 4px 0;
      background: #0f172a;
      padding: 4px 7px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .dice-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 900;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      color: #94a3b8;
      border: 2px solid #475569;
      touch-action: manipulation;
    }

    /* Dadu Menyala Saat Benar */
    .dice-btn.lit {
      background: linear-gradient(145deg, #facc15, #f59e0b);
      color: #0f172a;
      border-color: #fef08a;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.85);
      animation: pulseDice 1s infinite alternate;
    }

    @keyframes pulseDice {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .dice-info {
      font-size: 11px;
      line-height: 1.25;
      text-align: left;
      color: #cbd5e1;
      flex: 1;
    }

    .p-soal {
      font-size: 12px;
      font-weight: 600;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-y: auto;
      padding: 3px;
      line-height: 1.25;
    }

    .p-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .opt-btn {
      background: #334155;
      color: white;
      border: 1px solid #475569;
      padding: 7px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      touch-action: manipulation;
    }

    .opt-btn:active {
      transform: scale(0.95);
      background: #0284c7;
    }

    .p-toast {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      display: none;
      z-index: 5;
    }

    /* Hasil Akhir */
    table { width: 100%; border-collapse: collapse; margin: 14px 0; }
    th, td { padding: 9px; border-bottom: 1px solid #475569; text-align: center; font-size: 14px; }
    th { background: #0f172a; color: #38bdf8; }
  </style>
</head>
<body>

  <!-- Audio Backsound -->
  <audio id="bg-music" src="sound.mp3" loop preload="auto"></audio>

  <!-- 1. HALAMAN LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="card">
      <h1>Login Admin</h1>
      <input type="text" id="login-user" placeholder="Username" autocomplete="off">
      <input type="password" id="login-pass" placeholder="Password" autocomplete="off">
      <button id="btn-login" onclick="handleLogin()">Masuk</button>
      <p id="login-msg" style="color: #f43f5e; margin-top: 12px; font-size: 14px; line-height: 1.4;"></p>
    </div>
  </div>

  <!-- 2. HALAMAN PILIH KELAS -->
  <div id="screen-kelas" class="screen">
    <div class="card">
      <h2>Pilih Kelas</h2>
      <div id="kelas-list" class="kelas-grid"></div>
    </div>
  </div>

  <!-- 3. HALAMAN CATATAN -->
  <div id="screen-catatan" class="screen">
    <div class="card" style="max-width: 650px;">
      <h2>Catatan Pembelajaran</h2>
      <div id="catatan-content" class="catatan-box"></div>
      <button onclick="goToAcak()">Lanjut Acak Pemain</button>
    </div>
  </div>

  <!-- 4. HALAMAN ACAK 4 SISWA -->
  <div id="screen-acak" class="screen">
    <div class="card">
      <h2>Pemain Terpilih (<span id="label-kelas"></span>)</h2>
      <div id="selected-players" class="player-select-list"></div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button style="background: #64748b;" onclick="acakUlangSemua()">Acak Ulang Semua</button>
        <button style="background: #16a34a;" onclick="startGame()">MULAI GAME</button>
      </div>
    </div>
  </div>

  <!-- 5. HALAMAN GAME -->
  <div id="screen-game" class="screen">
    <div id="board-section">
      <div id="hud-top">
        <div class="hud-badge" id="hud-kelas">Kelas: -</div>
        <div class="hud-badge" id="hud-timer">Sisa Waktu: 06:00</div>
      </div>
      <div id="board-wrapper">
        <img id="board-img" src="Papan Ular Tangga SD Inpres Binanga 1.webp" alt="Papan Ular Tangga">
      </div>
    </div>
    <div id="players-panel"></div>
  </div>

  <!-- 6. HALAMAN HASIL -->
  <div id="screen-hasil" class="screen">
    <div class="card" style="max-width: 620px;">
      <h1>Hasil Permainan (6 Menit)</h1>
      <table>
        <thead>
          <tr>
            <th>Peringkat</th>
            <th>Nama Siswa</th>
            <th>Petak</th>
            <th>Nilai</th>
            <th>Waktu</th>
          </tr>
        </thead>
        <tbody id="hasil-tbody"></tbody>
      </table>
      <p id="save-status" style="font-size: 13px; color: #38bdf8; margin-bottom: 15px;">Menyimpan ke database...</p>
      <button onclick="location.reload()">Main Lagi</button>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxn2cHrynm_OZDfUttcEx6OFrzn-BWmzNLEVyfVAP2eEjGINc93Fy28MG6GrPm7qTPqJA/exec';

    const SESSION_SECONDS = 6 * 60; // 6 menit = 360 detik
    const COLS = 10;
    const ROWS = 10;
    const TOTAL_TILES = 100;

    // Tangga & Ular yang rapi dan tidak berdempetan
    const LADDERS = {
      5: 26,
      14: 35,
      28: 49,
      42: 63,
      54: 75,
      68: 89
    };

    const SNAKES = {
      24: 7,
      38: 18,
      52: 31,
      66: 46,
      82: 61,
      96: 74
    };

    const PLAYER_COLORS = [
      { hex: '#ef4444', label: '1' },
      { hex: '#3b82f6', label: '2' },
      { hex: '#22c55e', label: '3' },
      { hex: '#eab308', label: '4' }
    ];

    let dbData = { kelas: {}, catatan: [], soal: [] };
    let currentKelas = '';
    let availableStudents = [];
    let activePlayers = [];
    let remainingSeconds = SESSION_SECONDS;
    let timerInterval = null;
    let gameEnded = false;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // 1. LOGIN ADMIN
    async function handleLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const msg = document.getElementById('login-msg');
      const btn = document.getElementById('btn-login');

      if (!user || !pass) {
        msg.innerText = 'Isi username dan password!';
        return;
      }

      btn.disabled = true;
      msg.style.color = '#38bdf8';
      msg.innerText = 'Memeriksa akun & memuat database...';

      try {
        const resLogin = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        const loginJson = await resLogin.json();

        if (loginJson.status === 'success') {
          const resData = await fetch(`${GAS_URL}?action=getData`);
          const dataJson = await resData.json();

          if (dataJson.status === 'success') {
            dbData = dataJson;
            renderKelasButtons();
            showScreen('screen-kelas');
          } else {
            throw new Error(dataJson.message || 'Gagal memuat data sheet');
          }
        } else {
          msg.style.color = '#f43f5e';
          msg.innerText = loginJson.message || 'Login gagal!';
          btn.disabled = false;
        }
      } catch (err) {
        msg.style.color = '#f43f5e';
        msg.innerText = 'Error: ' + err.message;
        btn.disabled = false;
      }
    }

    // 2. PILIH KELAS
    function renderKelasButtons() {
      const container = document.getElementById('kelas-list');
      container.innerHTML = '';
      const kelasKeys = Object.keys(dbData.kelas || {});
      if (kelasKeys.length === 0) {
        container.innerHTML = '<p style="grid-column: span 2; color: #f87171;">Data kelas kosong di sheet Nama.</p>';
        return;
      }
      kelasKeys.forEach(kls => {
        const btn = document.createElement('button');
        btn.className = 'kelas-btn';
        btn.innerText = kls.replace('_', ' ');
        btn.onclick = () => selectKelas(kls);
        container.appendChild(btn);
      });
    }

    function selectKelas(kls) {
      currentKelas = kls;
      availableStudents = [...(dbData.kelas[kls] || [])];

      const catBox = document.getElementById('catatan-content');
      if (dbData.catatan && dbData.catatan.length > 0) {
        catBox.innerHTML = dbData.catatan.map(c => `<p style="margin-bottom:10px;">${c}</p>`).join('');
      } else {
        catBox.innerHTML = '<p>Tidak ada catatan pada database.</p>';
      }
      showScreen('screen-catatan');
    }

    // 3. ACAK 4 NAMA + TOMBOL SKIP
    function goToAcak() {
      document.getElementById('label-kelas').innerText = currentKelas.replace('_', ' ');
      acakUlangSemua();
      showScreen('screen-acak');
    }

    function acakUlangSemua() {
      let pool = [...(dbData.kelas[currentKelas] || [])];
      pool.sort(() => Math.random() - 0.5);

      const soalLen = (dbData.soal && dbData.soal.length > 0) ? dbData.soal.length : 1;

      activePlayers = pool.slice(0, 4).map((name, idx) => ({
        id: idx,
        name: name,
        color: PLAYER_COLORS[idx],
        pos: 1,
        score: 0,
        canRoll: false,       // Dadu menyala hanya jika menjawab benar
        isAnswering: false,   // Menjawab soal aktif
        isMoving: false,      // Sedang melompat
        finished: false,
        finishElapsed: null,
        currentSoalIdx: Math.floor(Math.random() * soalLen),
        lastDice: '-',
        pawnEl: null
      }));
      availableStudents = pool.slice(4);
      renderSelectedPlayers();
    }

    function skipPlayer(index) {
      if (availableStudents.length === 0) {
        alert('Cadangan siswa di kelas ini sudah habis!');
        return;
      }
      const nextStudent = availableStudents.shift();
      activePlayers[index].name = nextStudent;
      renderSelectedPlayers();
    }

    function renderSelectedPlayers() {
      const list = document.getElementById('selected-players');
      list.innerHTML = '';
      activePlayers.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.style.borderLeftColor = p.color.hex;
        div.innerHTML = `
          <span><strong>P${idx + 1}:</strong> ${p.name}</span>
          <button class="btn-skip" onclick="skipPlayer(${idx})">Skip (Tidak Hadir)</button>
        `;
        list.appendChild(div);
      });
    }

    // ==========================================
    // 4. PAPAN GAMBAR 2D & BIDAK PEMAIN
    // ==========================================
    function getTilePercent(num) {
      const idx = num - 1;
      const row = Math.floor(idx / COLS); // 0 = bawah, 9 = atas
      let col = idx % COLS;
      if (row % 2 === 1) col = (COLS - 1) - col;

      // Area kotak papan di dalam gambar penuh
      const leftMin = 12;
      const leftMax = 88;
      const topMin = 17;
      const topMax = 93;

      const xPct = leftMin + ((col + 0.5) / COLS) * (leftMax - leftMin);
      const yPct = topMax - ((row + 0.5) / ROWS) * (topMax - topMin);
      return { x: xPct, y: yPct };
    }

    function getPlayerSubOffset(idx) {
      const offsets = [
        { dx: -1.1, dy: -1.1 },
        { dx:  1.1, dy: -1.1 },
        { dx: -1.1, dy:  1.1 },
        { dx:  1.1, dy:  1.1 }
      ];
      return offsets[idx];
    }

    function initBoardPawns() {
      const wrapper = document.getElementById('board-wrapper');
      wrapper.querySelectorAll('.pawn').forEach(el => el.remove());

      activePlayers.forEach((p, idx) => {
        const el = document.createElement('div');
        el.className = 'pawn';
        el.style.backgroundColor = p.color.hex;
        el.innerText = p.color.label;
        wrapper.appendChild(el);
        p.pawnEl = el;
        placePawnAtTile(idx, 1, 0);
      });
    }

    function placePawnAtTile(pIdx, tileNum, jumpLiftPct = 0) {
      const p = activePlayers[pIdx];
      const coord = getTilePercent(tileNum);
      const sub = getPlayerSubOffset(pIdx);
      p.pawnEl.style.left = `${coord.x + sub.dx}%`;
      p.pawnEl.style.top = `${coord.y + sub.dy - jumpLiftPct}%`;
    }

    // ==========================================
    // 5. LOGIKA GAME & TIMER 6 MENIT
    // ==========================================
    function startGame() {
      if (!dbData.soal || dbData.soal.length === 0) {
        alert('Sheet "Soal" masih kosong! Isi minimal 1 soal terlebih dahulu.');
        return;
      }

      const audio = document.getElementById('bg-music');
      audio.play().catch(e => console.log('Audio play:', e));

      gameEnded = false;
      remainingSeconds = SESSION_SECONDS;
      document.getElementById('hud-kelas').innerText = `Kelas: ${currentKelas.replace('_', ' ')}`;
      updateTimerText();

      showScreen('screen-game');
      initBoardPawns();
      renderPlayerPanels();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerText();
        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateTimerText();
          finishSession('Waktu 6 menit habis!');
        }
      }, 1000);
    }

    function updateTimerText() {
      const mins = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
      const secs = String(remainingSeconds % 60).padStart(2, '0');
      document.getElementById('hud-timer').innerText = `Sisa Waktu: ${mins}:${secs}`;
    }

    function getElapsedFormatted() {
      const elapsed = SESSION_SECONDS - remainingSeconds;
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function renderPlayerPanels() {
      const panel = document.getElementById('players-panel');
      panel.innerHTML = '';

      activePlayers.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'p-card';
        card.style.borderTopColor = p.color.hex;

        card.innerHTML = `
          <div class="p-header">
            <span style="color:${p.color.hex}">${p.name}</span>
            <span id="p-pos-${idx}">Petak: 1 | Skor: 0</span>
          </div>
          <div class="dice-row">
            <button class="dice-btn" id="dice-btn-${idx}">🎲</button>
            <div class="dice-info" id="dice-info-${idx}">Jawab soal untuk menyalakan dadu</div>
          </div>
          <div class="p-soal" id="p-soal-${idx}"></div>
          <div class="p-options" id="p-opts-${idx}"></div>
          <div class="p-toast" id="p-toast-${idx}"></div>
        `;
        panel.appendChild(card);

        const diceBtn = document.getElementById(`dice-btn-${idx}`);
        diceBtn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleRollDice(idx);
        });

        loadQuestionForPlayer(idx);
        updateDiceUI(idx);
      });
    }

    function updateDiceUI(pIdx) {
      const p = activePlayers[pIdx];
      const btn = document.getElementById(`dice-btn-${pIdx}`);
      const info = document.getElementById(`dice-info-${pIdx}`);

      if (p.finished) {
        btn.disabled = true;
        btn.classList.remove('lit');
        btn.innerText = '✓';
        info.innerText = 'Sudah Finish!';
        return;
      }

      if (p.canRoll && !p.isMoving) {
        btn.disabled = false;
        btn.classList.add('lit');
        btn.innerText = p.lastDice === '-' ? '🎲' : String(p.lastDice);
        info.style.color = '#facc15';
        info.innerText = 'BENAR! Tekan dadu (1–6)';
      } else {
        btn.disabled = true;
        btn.classList.remove('lit');
        btn.innerText = p.lastDice === '-' ? '🔒' : String(p.lastDice);
        info.style.color = '#94a3b8';
        info.innerText = p.isMoving ? 'Bidak melompat...' : 'Dadu mati (jawab benar)';
      }
    }

    function showToast(pIdx, text, color = '#38bdf8') {
      const toast = document.getElementById(`p-toast-${pIdx}`);
      toast.style.display = 'block';
      toast.style.color = color;
      toast.innerText = text;
      setTimeout(() => {
        if (toast) toast.style.display = 'none';
      }, 1500);
    }

    function loadQuestionForPlayer(pIdx) {
      const player = activePlayers[pIdx];
      if (player.finished || gameEnded) return;

      const soalObj = dbData.soal[player.currentSoalIdx];
      document.getElementById(`p-soal-${pIdx}`).innerText = soalObj.soal;

      const optsContainer = document.getElementById(`p-opts-${pIdx}`);
      optsContainer.innerHTML = '';

      ['A', 'B', 'C', 'D'].forEach(optKey => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${optKey}. ${soalObj[optKey]}`;

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleAnswer(pIdx, optKey);
        });
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(pIdx, selectedOpt) {
      const player = activePlayers[pIdx];
      if (gameEnded || player.finished || player.isMoving || player.canRoll) return;

      const soalObj = dbData.soal[player.currentSoalIdx];
      const isCorrect = (selectedOpt === soalObj.kunci);

      if (isCorrect) {
        player.score += 10;
        player.canRoll = true;
        showToast(pIdx, 'BENAR! Dadu menyala, silakan acak dadu.', '#4ade80');
      } else {
        player.canRoll = false;
        showToast(pIdx, 'SALAH! Dadu tidak bisa diacak.', '#f87171');
      }

      document.getElementById(`p-pos-${pIdx}`).innerText = `Petak: ${player.pos} | Skor: ${player.score}`;
      player.currentSoalIdx = (player.currentSoalIdx + 1 + Math.floor(Math.random() * 3)) % dbData.soal.length;
      loadQuestionForPlayer(pIdx);
      updateDiceUI(pIdx);
    }

    async function handleRollDice(pIdx) {
      const player = activePlayers[pIdx];
      if (gameEnded || !player.canRoll || player.isMoving || player.finished) return;

      player.canRoll = false;
      player.isMoving = true;
      updateDiceUI(pIdx);

      const diceValue = Math.floor(Math.random() * 6) + 1;
      player.lastDice = diceValue;
      document.getElementById(`dice-btn-${pIdx}`).innerText = String(diceValue);
      showToast(pIdx, `Dadu keluar: ${diceValue}!`, '#facc15');

      // Langkah maju 1..diceValue
      for (let s = 0; s < diceValue; s++) {
        if (player.pos >= TOTAL_TILES) break;
        const nextTile = player.pos + 1;
        await animatePawnHop(pIdx, player.pos, nextTile, 180);
        player.pos = nextTile;
      }

      // Cek Tangga atau Ular
      if (LADDERS[player.pos]) {
        const dest = LADDERS[player.pos];
        showToast(pIdx, `NAIK TANGGA ke petak ${dest}!`, '#4ade80');
        await animatePawnHop(pIdx, player.pos, dest, 420);
        player.pos = dest;
      } else if (SNAKES[player.pos]) {
        const dest = SNAKES[player.pos];
        showToast(pIdx, `TURUN ULAR ke petak ${dest}!`, '#fb7185');
        await animatePawnHop(pIdx, player.pos, dest, 420);
        player.pos = dest;
      }

      document.getElementById(`p-pos-${pIdx}`).innerText = `Petak: ${player.pos} | Skor: ${player.score}`;

      if (player.pos >= TOTAL_TILES) {
        player.pos = TOTAL_TILES;
        player.finished = true;
        player.finishElapsed = getElapsedFormatted();
        showToast(pIdx, `FINISH! (${player.finishElapsed})`, '#facc15');
      }

      player.isMoving = false;
      updateDiceUI(pIdx);

      if (activePlayers.every(pl => pl.finished)) {
        finishSession('Semua pemain mencapai FINISH!');
      }
    }

    function animatePawnHop(pIdx, fromTile, toTile, duration) {
      return new Promise((resolve) => {
        const p = activePlayers[pIdx];
        const c1 = getTilePercent(fromTile);
        const c2 = getTilePercent(toTile);
        const sub = getPlayerSubOffset(pIdx);
        const startTime = performance.now();

        function step(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const curX = c1.x + (c2.x - c1.x) * t + sub.dx;
          const curY = c1.y + (c2.y - c1.y) * t + sub.dy;
          const lift = Math.sin(t * Math.PI) * 3.5;

          p.pawnEl.style.left = `${curX}%`;
          p.pawnEl.style.top = `${curY - lift}%`;

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            placePawnAtTile(pIdx, toTile, 0);
            resolve();
          }
        }
        requestAnimationFrame(step);
      });
    }

    // ==========================================
    // 6. AKHIR SESI & SIMPAN KE GOOGLE SHEETS
    // ==========================================
    async function finishSession(reasonText) {
      if (gameEnded) return;
      gameEnded = true;
      clearInterval(timerInterval);
      document.getElementById('bg-music').pause();

      showScreen('screen-hasil');

      const sorted = [...activePlayers].sort((a, b) => {
        if (a.finished && !b.finished) return -1;
        if (!a.finished && b.finished) return 1;
        if (b.pos !== a.pos) return b.pos - a.pos;
        return b.score - a.score;
      });

      const tbody = document.getElementById('hasil-tbody');
      tbody.innerHTML = sorted.map((p, idx) => {
        const waktuTampil = p.finishElapsed || getElapsedFormatted();
        return `
          <tr>
            <td>#${idx + 1}</td>
            <td>${p.name}</td>
            <td>${p.pos}</td>
            <td>${p.score}</td>
            <td>${waktuTampil}</td>
          </tr>
        `;
      }).join('');

      const payload = sorted.map(p => ({
        nama: `${p.name} (${currentKelas})`,
        nilai: p.score,
        timer: p.finishElapsed || getElapsedFormatted()
      }));

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'saveResult', results: payload })
        });
        document.getElementById('save-status').innerText = `${reasonText} Nilai & timer tersimpan ke Google Sheets.`;
      } catch (e) {
        document.getElementById('save-status').innerText = `${reasonText} Gagal menyimpan ke Google Sheets.`;
      }
    }
  </script>
